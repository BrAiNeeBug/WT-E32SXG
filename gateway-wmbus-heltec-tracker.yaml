esphome:
  comment: "Ver.2.0.0.2"
  name: "meter-htt11"
  friendly_name: "WT-E32SXG (2.0)"
  on_boot:
    - priority: -100
      then:
        - script.execute: display_wake
    - priority: -50
      then:
        # Runtime start values for the log tags (ceiling is VERY_VERBOSE, see logger: below)
        - lambda: |-
            id(logger_id)->set_log_level("wmbus", 0);        // NONE
            id(logger_id)->set_log_level("wmbusmeters", 0);  // NONE
            id(logger_id)->set_log_level("packet", 0);       // NONE

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  #toolchain: platformio # TODO 2026-07-16: try removing this again later

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: LIGHT

captive_portal:

logger:
  id: logger_id
  level: VERY_VERBOSE       # compile-time ceiling: allows full range in the web GUI switch
  initial_level: NONE       # global runtime start value: fully quiet after boot
  logs:
    wmbus: VERY_VERBOSE     # ceiling for the tag, actual start value comes from on_boot above
    wmbusmeters: VERY_VERBOSE
    packet: VERY_VERBOSE
  runtime_tag_levels: true

select:
  - platform: logger
    name: "Log Level"
    id: log_level_select
    on_value:
      then:
        - lambda: |-
            int lvl = 1; // fallback ERROR
            if (x == "NONE") lvl = 0;
            else if (x == "ERROR") lvl = 1;
            else if (x == "WARN") lvl = 2;
            else if (x == "INFO") lvl = 3;
            else if (x == "CONFIG") lvl = 4;
            else if (x == "DEBUG") lvl = 5;
            else if (x == "VERBOSE") lvl = 6;
            else if (x == "VERY_VERBOSE") lvl = 7;
            id(logger_id)->set_log_level("wmbus", lvl);
            id(logger_id)->set_log_level("wmbusmeters", lvl);
            id(logger_id)->set_log_level("packet", lvl);

web_server:
  port: 80
  version: 2
  auth:
    password: !secret ota_password
    username: admin
    type: digest

time:
  - platform: homeassistant

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [wmbus_radio, wmbus_common, wmbus_meter]

#############################################
########## SX1262 wM-Bus receiver ############
#############################################

spi:
  - id: spi_sx1262
    clk_pin: GPIO9    # LoRa_SCK
    mosi_pin: GPIO10  # LoRa_MOSI
    miso_pin: GPIO11  # LoRa_MISO
  - id: spi_st7735
    clk_pin: GPIO41   # Display SCLK
    mosi_pin: GPIO42  # Display SDIN

wmbus_radio:
  radio_type: SX1262
  spi_id: spi_sx1262
  cs_pin: GPIO8       # LoRa_NSS
  reset_pin: GPIO12   # LoRa_RST
  irq_pin: GPIO14     # DIO1
  busy_pin: GPIO13    # LoRa_BUSY
  frequency: "868.95MHz"
  rx_gain: POWER_SAVING
  rf_switch: true
  has_tcxo: true

# Meter IDs and AES keys are secret and specific to your own meters.
# See secrets.yaml.example for the required keys (meter1_id, meter1_key, meter2_id, meter2_key).
# Add as many wmbus_meter / sensor blocks below as you have meters.
wmbus_meter:
  - id: meter1
    meter_id: !secret meter1_id
    type: hydrus
    key: !secret meter1_key

  - id: meter2
    meter_id: !secret meter2_id
    type: hydrus
    key: !secret meter2_key

sensor:
  # Meter 1 (e.g. main water)
  - platform: wmbus_meter
    parent_id: meter1
    field: total_m3
    name: "Meter 1 Total"
    id: meter1_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total_increasing
    on_value:
      then:
        - component.update: difference_total

  - platform: wmbus_meter
    parent_id: meter1
    field: total_at_date_m3
    name: "Meter 1 Reading at Billing Date"
    unit_of_measurement: "m³"
    entity_category: diagnostic
    accuracy_decimals: 2

  - platform: wmbus_meter
    parent_id: meter1
    field: remaining_battery_life_y
    name: "Meter 1 Battery Life"
    unit_of_measurement: "years"
    entity_category: diagnostic

  - platform: wmbus_meter
    parent_id: meter1
    field: rssi_dbm
    name: "Meter 1 RSSI"
    entity_category: diagnostic

  # Meter 2 (e.g. garden water)
  - platform: wmbus_meter
    parent_id: meter2
    field: total_m3
    name: "Meter 2 Total"
    id: meter2_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total_increasing
    on_value:
      then:
        - component.update: difference_total

  - platform: wmbus_meter
    parent_id: meter2
    field: total_at_date_m3
    name: "Meter 2 Reading at Billing Date"
    unit_of_measurement: "m³"
    entity_category: diagnostic
    accuracy_decimals: 2

  - platform: wmbus_meter
    parent_id: meter2
    field: remaining_battery_life_y
    name: "Meter 2 Battery Life"
    unit_of_measurement: "years"
    entity_category: diagnostic

  - platform: wmbus_meter
    parent_id: meter2
    field: rssi_dbm
    name: "Meter 2 RSSI"
    entity_category: diagnostic

  # Derived value: e.g. wastewater = meter1 - meter2
  - platform: template
    name: "Difference Total"
    id: difference_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total
    update_interval: never
    lambda: |-
      return id(meter1_total).state - id(meter2_total).state;

text_sensor:
  - platform: uptime
    name: "System Uptime"
    id: uptime_human
    entity_category: diagnostic

#############################################
############ Display (ST7735) ################
#############################################

# Display needs 2 GPIOs HIGH to power on
switch:
  - platform: gpio
    pin: GPIO21        # LED_K_Pin
    id: led_k_pin
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin:
      number: GPIO3    # Vext_Ctrl
      ignore_strapping_warning: true
    id: vtft_ctrl_pin
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto Mono"
    id: my_font
    size: 18

color:
  - id: white
    red: 100%
    green: 100%
    blue: 100%
  - id: blue
    red: 0%
    green: 60%
    blue: 100%
  - id: green
    red: 0%
    green: 100%
    blue: 40%

display:
  - platform: ili9xxx
    spi_id: spi_st7735
    model: st7735
    id: st7735
    dc_pin: GPIO40
    reset_pin: GPIO39
    cs_pin: GPIO38
    color_order: bgr
    invert_colors: true
    dimensions:
      width: 160
      height: 80
      offset_width: 1
      offset_height: 26
    transform:
      swap_xy: true
      mirror_y: false
      mirror_x: true
    data_rate: 40MHz
    auto_clear_enabled: true
    lambda: |-
      it.printf(0,  0, id(my_font), id(blue),  "M1: %.2f m3", id(meter1_total).state);
      it.printf(0, 26, id(my_font), id(green), "M2: %.2f m3", id(meter2_total).state);
      it.printf(0, 52, id(my_font), id(white), "Diff: %.2f m3", id(difference_total).state);

#############################################
###### Display auto-off + user button ########
#############################################

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: user_button
    name: "Display Button"
    internal: true
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute: display_wake

script:
  - id: display_wake
    mode: restart
    then:
      - switch.turn_on: led_k_pin
      - switch.turn_on: vtft_ctrl_pin
      - delay: 60s
      - switch.turn_off: led_k_pin
      - switch.turn_off: vtft_ctrl_pin

button:
  - platform: restart
    name: "Restart"
    device_class: restart
    entity_category: config
