# 2.0.0.4-5 set webserver to version 3 (HA style), new display driver mipi_spi 31.08.2026
# 2.0.0.6 new priv_api_key, time set to ntp, added wifi sensors
# 2.0.0.7 changed display driver back to ili9xxx (black screen!?)
# 2.0.0.8 changed wifi power save to high
# 2.0.0.9 changed OTA updates to encryption
# 2.0.1.0 removed webserver OTA
# 2.0.1.1 switched displaydriver to mipi_spi
# 2.0.1.2 added GitHub link (comment, project, dashboard_import)
# 2.0.1.3 added wm-bus stuff private supported fork
substitutions:
  version: "2.0.1.3"
  localdomain: ".fritz.box"
esphome:
  comment: "Ver.${version} - github.com/BrAiNeeBug/WT-E32SXG"
  project:
    name: "BrAiNeeBug.wmbus_heltec_tracker"
    version: "${version}"
  name: "meter-htt11"
  friendly_name: "WT-E32SXG (2.0)"
  on_boot:
    - priority: -100
      then:
        - script.execute: display_wake
    - priority: -50
      then:
        # Runtime start values for the log tags (ceiling is VERY_VERBOSE, see logger:)
        - lambda: |-
            id(logger_id)->set_log_level("wmbus", 0);        // NONE
            id(logger_id)->set_log_level("wmbusmeters", 0);  // NONE
            id(logger_id)->set_log_level("packet", 0);       // NONE

dashboard_import:
  package_import_url: github://BrAiNeeBug/WT-E32SXG/wmbus-heltec-tracker_ENG.yaml@main

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  #toolchain: platformio # debug 16.07.2026, can be removed later

api:
  encryption:
    key: !secret meter_htt11__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: HIGH
  domain: ${localdomain}

captive_portal:

logger:
  id: logger_id
  level: VERY_VERBOSE       # Compile-time ceiling: allows the full range in the web GUI selector
  initial_level: NONE       # Global runtime start value: completely silent after boot
  logs:
    wmbus: VERY_VERBOSE     # Ceiling for the tag, the actual start value is set in on_boot above
    wmbusmeters: VERY_VERBOSE
    packet: VERY_VERBOSE
  runtime_tag_levels: true

select:
  - platform: logger
    name: "Log Level"
    id: log_level_select
    on_value:
      then:
        - lambda: |-
            int lvl = 1; // Fallback: ERROR
            if (x == "NONE") lvl = 0;
            else if (x == "ERROR") lvl = 1;
            else if (x == "WARN") lvl = 2;
            else if (x == "INFO") lvl = 3;
            else if (x == "CONFIG") lvl = 4;
            else if (x == "DEBUG") lvl = 5;
            else if (x == "VERBOSE") lvl = 6;
            else if (x == "VERY_VERBOSE") lvl = 7;
            id(logger_id)->set_log_level("wmbus", lvl);
            id(logger_id)->set_log_level("wmbusmeters", lvl);
            id(logger_id)->set_log_level("packet", lvl);

web_server:
  port: 80
  version: 3
  auth:
    password: !secret webgui_password
    username: admin
    type: digest
  ota: false
time:
  - platform: sntp
    id: timesrc

external_components:
  - source: github://BrAiNeeBug/esphome-components@main
    components: [wmbus_radio, wmbus_common, wmbus_meter]

#############################################
########## SX1262 wM-Bus receiver ###########
#############################################

spi:
  - id: spi_sx1262
    clk_pin: GPIO9    # LoRa_SCK
    mosi_pin: GPIO10  # LoRa_MOSI
    miso_pin: GPIO11  # LoRa_MISO
  - id: spi_st7735
    clk_pin: GPIO41   # Display SCLK
    mosi_pin: GPIO42  # Display SDIN

wmbus_radio:
  radio_type: SX1262
  spi_id: spi_sx1262
  cs_pin: GPIO8       # LoRa_NSS
  reset_pin: GPIO12   # LoRa_RST
  irq_pin: GPIO14     # DIO1
  busy_pin: GPIO13    # LoRa_BUSY
  frequency: "868.95MHz"
  rx_gain: POWER_SAVING
  rf_switch: true
  has_tcxo: true

wmbus_meter:
  - id: meter99
    meter_id: !secret meter99_id
    type: hydrus
    key: !secret meter99_key

  - id: meter15
    meter_id: !secret meter15_id
    type: hydrus
    key: !secret meter15_key

sensor:
  # Main water meter
  - platform: wmbus_meter
    parent_id: meter99
    field: total_m3
    name: "Main Water"
    id: main_water_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total_increasing
    on_value:
      then:
        - component.update: wastewater_total

  - platform: wmbus_meter
    parent_id: meter99
    field: total_at_date_m3
    name: "Main Water Billing Date Value"
    unit_of_measurement: "m³"
    entity_category: diagnostic
    accuracy_decimals: 2

  - platform: wmbus_meter
    parent_id: meter99
    field: remaining_battery_life_y
    name: "Main Water Battery Life"
    unit_of_measurement: "years"
    entity_category: diagnostic

  - platform: wmbus_meter
    parent_id: meter99
    field: rssi_dbm
    name: "Main Water RSSI"
    entity_category: diagnostic

  # Garden water meter
  - platform: wmbus_meter
    parent_id: meter15
    field: total_m3
    name: "Garden Water"
    id: garden_water_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total_increasing
    on_value:
      then:
        - component.update: wastewater_total

  - platform: wmbus_meter
    parent_id: meter15
    field: total_at_date_m3
    name: "Garden Water Billing Date Value"
    unit_of_measurement: "m³"
    entity_category: diagnostic
    accuracy_decimals: 2

  - platform: wmbus_meter
    parent_id: meter15
    field: remaining_battery_life_y
    name: "Garden Water Battery Life"
    unit_of_measurement: "years"
    entity_category: diagnostic

  - platform: wmbus_meter
    parent_id: meter15
    field: rssi_dbm
    name: "Garden Water RSSI"
    entity_category: diagnostic

  # Wastewater = main water minus garden water (garden water does not go into the sewer)
  - platform: template
    name: "Wastewater"
    id: wastewater_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total
    update_interval: never
    lambda: |-
      return id(main_water_total).state - id(garden_water_total).state;

  # Other sensors
  - platform: wifi_signal
    name: "WiFiSignal"
    id: wifi_signal_rssi
    update_interval: 30s
    entity_category: diagnostic
    icon: "mdi:wifi-strength-2"
    disabled_by_default: true

text_sensor:
  - platform: template
    name: "SystemClock"
    id: current_time_display
    icon: "mdi:clock-outline"
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", now.hour, now.minute, now.second);
      return std::string(buf);
    entity_category: diagnostic
    disabled_by_default: true

  - platform: uptime
    name: "System Uptime"
    id: uptime_human
    entity_category: diagnostic
    disabled_by_default: true

  - platform: wifi_info
    ssid:
      name: "WiFiSSID"
      icon: "mdi:wifi"
      entity_category: diagnostic
      disabled_by_default: true
    ip_address:
      name: "WiFiIP"
      icon: "mdi:ip-network"
      entity_category: diagnostic
      disabled_by_default: true

#############################################
############ Display (ST7735) ###############
#############################################

# The display needs 2 GPIOs set HIGH to power on
switch:
  - platform: gpio
    pin: GPIO21        # LED_K_Pin
    id: led_k_pin
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin:
      number: GPIO3    # Vext_Ctrl
      ignore_strapping_warning: true
    id: vtft_ctrl_pin
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto Mono"
    id: my_font
    size: 18

color:
  - id: white
    red: 100%
    green: 100%
    blue: 100%
  - id: blue
    red: 0%
    green: 60%
    blue: 100%
  - id: green
    red: 0%
    green: 100%
    blue: 40%

display:
  - platform: mipi_spi
    spi_id: spi_st7735
    model: st7735
    id: st7735
    dc_pin: GPIO40
    reset_pin: GPIO39
    cs_pin: GPIO38
    data_rate: 40MHz
    color_order: bgr
    invert_colors: true
    dimensions:
      width: 80
      height: 160
      offset_width: 26
      offset_height: 1
      pad_width: 26
      pad_height: 1
    rotation: 90°
    auto_clear_enabled: true
    lambda: |-
      const int dx = 3;  // left padding
      const int dy = 1;  // top padding
      it.printf(dx, dy,      id(my_font), id(blue),  "Mn:  %.2f m3", id(main_water_total).state);
      it.printf(dx, dy + 26, id(my_font), id(green), "Gdn: %.2f m3", id(garden_water_total).state);
      it.printf(dx, dy + 52, id(my_font), id(white), "Wst: %.2f m3", id(wastewater_total).state);

#############################################
###### Display auto-off + user button #######
#############################################

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: user_button
    name: "DSP-Button"
    internal: true
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute: display_wake

script:
  - id: display_wake
    mode: restart
    then:
      - switch.turn_on: led_k_pin
      - switch.turn_on: vtft_ctrl_pin
      - delay: 60s
      - switch.turn_off: led_k_pin
      - switch.turn_off: vtft_ctrl_pin

button:
  - platform: restart
    name: "Restart"
    device_class: restart
    entity_category: config
