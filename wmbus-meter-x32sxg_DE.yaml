#1.0.0.0 Migriert auf Seeed Studio XIAO ESP32S3 & Wio-SX1262 (Ohne Display)
#1.0.0.1 Radio-Pins korrigiert (B2B-Connector des Wio-SX1262), RXEN (GPIO38) wird auf HIGH gesetzt
#1.0.0.2 added GitHub link (comment, project, dashboard_import)
#1.0.0.3 added wm-bus stuff own fork
substitutions:
  version: "1.0.0.3"
  localdomain: ".fritz.box"

esphome:
  comment: "Ver.${version} - github.com/BrAiNeeBug/WT-E32SXG"
  project:
    name: "BrAiNeeBug.wmbus_meter_x32sxg"
    version: "${version}"
  name: "meter-x32sxg"
  friendly_name: "WX-E32SXG (1.0)"
  on_boot:
    - priority: -50
      then:
        # Runtime-Startwerte für die Log-Tags (Ceiling ist VERY_VERBOSE, siehe logger:)
        - lambda: |-
            id(logger_id)->set_log_level("wmbus", 0);        // NONE
            id(logger_id)->set_log_level("wmbusmeters", 0);  // NONE
            id(logger_id)->set_log_level("packet", 0);       // NONE

dashboard_import:
  package_import_url: github://BrAiNeeBug/WT-E32SXG/wmbus-meter-x32sxg_DE.yaml@main

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret meter_x32sxg__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: HIGH
  domain: ${localdomain}

captive_portal:

logger:
  id: logger_id
  level: VERY_VERBOSE       # Compile-Ceiling: erlaubt volle Range im Web-GUI-Schalter
  initial_level: NONE       # Runtime-Startwert global: komplett leise nach Boot
  logs:
    wmbus: VERY_VERBOSE     # Ceiling für den Tag, echter Startwert kommt aus on_boot oben
    wmbusmeters: VERY_VERBOSE
    packet: VERY_VERBOSE
  runtime_tag_levels: true

select:
  - platform: logger
    name: "Log Level"
    id: log_level_select
    on_value:
      then:
        - lambda: |-
            int lvl = 1; // Fallback ERROR
            if (x == "NONE") lvl = 0;
            else if (x == "ERROR") lvl = 1;
            else if (x == "WARN") lvl = 2;
            else if (x == "INFO") lvl = 3;
            else if (x == "CONFIG") lvl = 4;
            else if (x == "DEBUG") lvl = 5;
            else if (x == "VERBOSE") lvl = 6;
            else if (x == "VERY_VERBOSE") lvl = 7;
            id(logger_id)->set_log_level("wmbus", lvl);
            id(logger_id)->set_log_level("wmbusmeters", lvl);
            id(logger_id)->set_log_level("packet", lvl);

web_server:
  port: 80
  version: 3
  auth:
    password: !secret webgui_password
    username: admin
    type: digest
  ota: false

time:
  - platform: sntp
    id: timesrc

external_components:
  - source: github://BrAiNeeBug/esphome-components@main
    components: [wmbus_radio, wmbus_common, wmbus_meter]

#############################################
########## SX1262 wM-Bus Empfang #############
#############################################

spi:
  - id: spi_sx1262
    clk_pin: GPIO7    # SCK
    mosi_pin: GPIO9   # MOSI
    miso_pin: GPIO8   # MISO

# Wio-SX1262: RX-Pfad des Antennenschalters muss dauerhaft HIGH sein.
# (TX wird über DIO2 geschaltet, das erledigt rf_switch: true)
switch:
  - platform: gpio
    pin: GPIO38       # LORA RXEN
    id: lora_rxen
    restore_mode: ALWAYS_ON
    internal: true

wmbus_radio:
  radio_type: SX1262
  spi_id: spi_sx1262
  cs_pin: GPIO41      # NSS  (B2B-Connector)
  reset_pin: GPIO42   # RST  (B2B-Connector)
  irq_pin: GPIO39     # DIO1 (B2B-Connector)
  busy_pin: GPIO40    # BUSY (B2B-Connector)
  frequency: "868.95MHz"
  rx_gain: POWER_SAVING   # zum Testen ggf. auf die Boost-Variante stellen, falls die Komponente sie anbietet
  rf_switch: true     # DIO2 steuert den TX-Pfad des Antennenschalters
  has_tcxo: true      # TCXO hängt an DIO3

wmbus_meter:
  - id: meter99
    meter_id: !secret meter99_id
    type: hydrus
    key: !secret meter99_key

  - id: meter15
    meter_id: !secret meter15_id
    type: hydrus
    key: !secret meter15_key

sensor:
  # Hauptwasser
  - platform: wmbus_meter
    parent_id: meter99
    field: total_m3
    name: "Hauptwasser"
    id: hauptwasser_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total_increasing
    on_value:
      then:
        - component.update: abwasser_total

  - platform: wmbus_meter
    parent_id: meter99
    field: total_at_date_m3
    name: "Hauptwasser Stichtagswert"
    unit_of_measurement: "m³"
    entity_category: diagnostic
    accuracy_decimals: 2

  - platform: wmbus_meter
    parent_id: meter99
    field: remaining_battery_life_y
    name: "Hauptwasser Batterielebensdauer"
    unit_of_measurement: "Jahre"
    entity_category: diagnostic

  - platform: wmbus_meter
    parent_id: meter99
    field: rssi_dbm
    name: "Hauptwasser RSSI"
    entity_category: diagnostic

  # Gartenwasser
  - platform: wmbus_meter
    parent_id: meter15
    field: total_m3
    name: "Gartenwasser"
    id: gartenwasser_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total_increasing
    on_value:
      then:
        - component.update: abwasser_total

  - platform: wmbus_meter
    parent_id: meter15
    field: total_at_date_m3
    name: "Gartenwasser Stichtagswert"
    unit_of_measurement: "m³"
    entity_category: diagnostic
    accuracy_decimals: 2

  - platform: wmbus_meter
    parent_id: meter15
    field: remaining_battery_life_y
    name: "Gartenwasser Batterielebensdauer"
    unit_of_measurement: "Jahre"
    entity_category: diagnostic

  - platform: wmbus_meter
    parent_id: meter15
    field: rssi_dbm
    name: "Gartenwasser RSSI"
    entity_category: diagnostic

  - platform: template
    name: "Abwasser"
    id: abwasser_total
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    device_class: water
    state_class: total
    update_interval: never
    lambda: |-
      return id(hauptwasser_total).state - id(gartenwasser_total).state;

  # other sensors      
  - platform: wifi_signal
    name: "WiFiSignal"
    id: wifi_signal_rssi
    update_interval: 30s
    entity_category: diagnostic
    icon: "mdi:wifi-strength-2"
    disabled_by_default: true

text_sensor:
  - platform: template
    name: "SystemClock"
    id: current_time_display
    icon: "mdi:clock-outline"
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", now.hour, now.minute, now.second);
      return std::string(buf);
    entity_category: diagnostic
    disabled_by_default: true

  - platform: uptime
    name: "System Uptime"
    id: uptime_human
    entity_category: diagnostic
    disabled_by_default: true
    
  - platform: wifi_info
    ssid:
      name: "WiFiSSID"
      icon: "mdi:wifi"
      entity_category: diagnostic
      disabled_by_default: true
    ip_address:
      name: "WiFiIP"
      icon: "mdi:ip-network"
      entity_category: diagnostic
      disabled_by_default: true

button:
  - platform: restart
    name: "Restart"
    device_class: restart
    entity_category: config
